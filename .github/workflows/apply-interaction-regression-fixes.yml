name: Apply interaction regression fixes

on:
  push:
    branches: [fix-interaction-regressions]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-interaction-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply interaction fixes
        run: node scripts/apply-interaction-regression-fixes.mjs
      - name: Install dependencies
        run: npm install
      - name: Validate source content
        run: npx tsx scripts/validate-content.ts
      - name: Validate Hope mini explanations
        run: npx tsx scripts/validate-hope-mini-explanations.ts
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify safety guards are bundled
        run: |
          grep -R -Fq '解説確認中（停止）' dist/assets/*.js
          grep -R -Fq '__ui_check' dist/assets/*.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent explanation clicks from losing study state'
          git push origin HEAD:fix-interaction-regressions
