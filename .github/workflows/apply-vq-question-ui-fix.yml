name: Apply VQ question UI fix

on:
  push:
    branches: [full-app-qa-20260908]
    paths:
      - scripts/apply-vq-question-ui-fix.mjs
      - .github/workflows/apply-vq-question-ui-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-app-qa-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic App.tsx patch
        run: node scripts/apply-vq-question-ui-fix.mjs
      - name: Verify source and build
        run: |
          npm install
          npm install --no-save playwright
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-vq-exercises.ts
          npm run lint
          npm run build
      - name: Commit patched app
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo 'No App.tsx changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: render VQ question prompts correctly across study modes'
          git push origin HEAD:full-app-qa-20260908
