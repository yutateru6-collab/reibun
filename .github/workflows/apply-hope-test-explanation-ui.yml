name: Apply Hope test explanation UI patch

on:
  push:
    branches: [fix-hope-test-mini-explanations]
    paths:
      - 'scripts/fix-hope-test-explanation-ui.mjs'
      - '.github/workflows/apply-hope-test-explanation-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hope-test-mini-explanations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Hope test explanation UI patch
        run: node scripts/fix-hope-test-explanation-ui.mjs
      - name: Install dependencies
        run: npm install
      - name: Validate all Hope explanation mappings
        run: npx tsx scripts/validate-hope-mini-explanations.ts
      - name: Type-check and build
        run: |
          npm run lint
          npm run build
      - name: Verify Hope test UI labels and explanation text are bundled
        run: |
          grep -R -Fq 'ミニ解説を見る' dist/assets/*.js
          grep -R -Fq 'To live と to learn' dist/assets/*.js
      - name: Commit App fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: treat Hope official tests as mini-explanation decks'
          git push origin HEAD:fix-hope-test-mini-explanations
