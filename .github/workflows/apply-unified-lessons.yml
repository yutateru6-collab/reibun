name: Apply and validate unified lesson update
on:
  push:
    branches: [feat/unified-hope-lessons-20260913]
    paths: [.github/workflows/apply-unified-lessons.yml]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/feat/unified-hope-lessons-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-hope-lessons-20260913
          fetch-depth: 0
      - name: Verify exact source and apply reviewed change
        run: |
          test "$(git rev-parse HEAD:src/App.tsx)" = 9835a554a120c7798ec55e4eb9f4dc22e98f73a2
          python3 - <<'PY'
          import pathlib, base64, gzip, hashlib
          root = pathlib.Path('.github/unified-transfer')
          parts = [(root / f'part{i}.gz').read_bytes() for i in range(1,4)]
          # Restore a known two-symbol transport insertion. The exact patch is hash-checked below.
          encoded = base64.b64encode(parts[1]).decode()
          encoded = encoded.replace('gNdULOCOCQQ','gNdULOCQQ',1)[:7999] + 'n'
          parts[1] = base64.b64decode(encoded)
          compressed = b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest() == 'fbe80a38de0f83fe36d92e0069c4fd584e91d3fac2dd8b2e271f4467451a4e6f'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'ef5cc1c537ff421d84477d42ef701d4be7a0bbd06db5470b8bc0983c58aac004'
          pathlib.Path('/tmp/unified.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/unified-lessons-qa.yml /tmp/unified.patch
          git apply --exclude=.github/workflows/unified-lessons-qa.yml /tmp/unified.patch
          git diff --exit-code -- src/data
          git add src scripts README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: unify Hope lessons and simplify study navigation without migrating source IDs'
          git push origin HEAD:refs/heads/feat/unified-hope-lessons-20260913
          mkdir -p audit/source
          git rev-parse HEAD > audit/source/commit.txt
          git archive HEAD -o audit/source/source.tar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type, source, workbook and lesson-model checks
        run: |
          npm run lint
          npx tsx scripts/validate-content.ts
          npx tsx scripts/unified-lessons-model.ts
          npx tsx scripts/workbook-model-regression.ts
          npm run build
      - name: Browsers and Japanese fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser regression suites
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          mkdir -p audit/logs
          failed=0
          run_check() { echo "Running $1"; if bash -c "$2" > "audit/logs/$1.log" 2>&1; then echo "PASS $1"; else cat "audit/logs/$1.log"; failed=1; fi; }
          run_check new-chromium 'npx tsx scripts/unified-lessons-ui.ts'
          run_check new-webkit 'BROWSER=webkit npx tsx scripts/unified-lessons-ui.ts'
          run_check study-edges 'npx tsx scripts/study-edge-regression.ts'
          run_check workbook 'node scripts/workbook-ui-regression.mjs'
          run_check question-rendering 'npx tsx scripts/vq-question-rendering-regression.ts'
          run_check interactions 'node scripts/postfix-interaction-regression.mjs'
          run_check all-states 'npx tsx scripts/full-ui-state-audit.ts'
          run_check all-content 'npx tsx scripts/full-app-production-audit-v2.ts'
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-first-review
          path: audit/
          retention-days: 7
