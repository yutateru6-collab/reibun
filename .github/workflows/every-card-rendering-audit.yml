name: Every card rendering audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        group: [basic-example, basic-test, vq-sentence, vq-question]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright
      - name: Validate content and build
        run: |
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-vq-exercises.ts
          npm run lint
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-every-card.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reibun-every-card.log
          exit 1
      - name: Audit every standard card in ${{ matrix.group }}
        env:
          APP_URL: http://127.0.0.1:4173/?every_card=${{ github.sha }}
          AUDIT_GROUP: ${{ matrix.group }}
        run: npx tsx scripts/every-card-rendering-audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: every-card-${{ matrix.group }}
          path: |
            audit/every-card/${{ matrix.group }}
            /tmp/reibun-every-card.log
          retention-days: 14
