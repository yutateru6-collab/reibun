name: UI UX fix validation

on:
  push:
    branches: [ui-ux-fixes-except-card-face]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Validate source-derived content
        run: npx tsx scripts/validate-content.ts

      - name: Verify Hope example replacement
        run: npx tsx scripts/validate-example-bank-replacement.ts

      - name: Verify all 110 Hope mini explanations
        run: npx tsx scripts/validate-hope-mini-explanations.ts

      - name: Verify 66 VQ exercises
        run: npx tsx scripts/validate-vq-exercises.ts

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install visual audit dependencies
        run: npm install --no-save playwright @axe-core/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reibun-preview.log
          exit 1

      - name: Visual and interaction regression check
        env:
          PUBLIC_URL: http://127.0.0.1:4173
        run: node scripts/ui-ux-fix-visual-check.mjs

      - name: Verify held item is still held
        run: |
          set -euo pipefail
          grep -Fq "// --- 通常のデッキ用の表示（既存のロジック） ---" src/App.tsx
          grep -Fq "{currentCard.front}" src/App.tsx
          grep -Fq "{currentCard.translation}" src/App.tsx
          echo "Held item preserved: normal Hope card face still shows English + Japanese together."

      - name: Upload post-fix screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-fix-screenshots
          path: audit/ui-ux-fixes
          if-no-files-found: error
          retention-days: 7
