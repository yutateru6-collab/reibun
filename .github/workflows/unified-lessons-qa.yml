name: Unified lessons QA
on:
  push:
    branches: [feat/unified-hope-lessons-20260913]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source for isolated review
        run: |
          mkdir -p review
          git archive HEAD -o review/source.tar
          git rev-parse HEAD > review/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-lessons-source
          path: review/
          retention-days: 3
