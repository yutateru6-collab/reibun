name: Apply Vision Quest explanation UI patch

on:
  push:
    branches: [fix-vq-explanation-ui-20260908]
    paths:
      - 'scripts/fix-vq-explanation-ui.mjs'
      - 'scripts/validate-vq-explanation-ui.ts'
      - 'src/data/vision_quest_points.ts'
      - '.github/workflows/apply-vq-explanation-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vq-explanation-ui-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted patch
        run: node scripts/fix-vq-explanation-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate source-derived content and UI rules
        run: |
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-vq-exercises.ts
          npx tsx scripts/validate-vq-explanation-ui.ts
      - name: Lint and build
        run: |
          npm run lint
          npm run build
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/data/vision_quest_exam_2026.ts scripts/validate-vq-exercises.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show VQ explanations and hide redundant labels'
          git push origin HEAD:fix-vq-explanation-ui-20260908
