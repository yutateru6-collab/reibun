name: Cloudflare readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate source-derived content
        run: npx tsx scripts/validate-content.ts

      - name: Type-check
        run: npm run lint

      - name: Build Vite app
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun

      - name: Smoke-test exact live Cloudflare content
        if: github.event_name != 'pull_request'
        env:
          PUBLIC_URL: https://reibun.itisnowornever271.workers.dev
          EXPECTED_CONTENT_VERSION: 2026-midterm-v1
        run: |
          set -euo pipefail
          echo "Waiting for Cloudflare Git deployment: $PUBLIC_URL"
          echo "Expected content version: $EXPECTED_CONTENT_VERSION"

          for attempt in $(seq 1 24); do
            echo "Attempt $attempt/24"

            status=$(curl -L -sS -o /tmp/reibun.html -w '%{http_code}' "$PUBLIC_URL/" || true)
            if [ "$status" = "200" ] && grep -q 'id="root"' /tmp/reibun.html; then
              manifest_status=$(curl -L -sS -o /tmp/manifest.json -w '%{http_code}' "$PUBLIC_URL/manifest.json" || true)
              asset_path=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/reibun.html | head -1 | cut -d'"' -f2 || true)

              if [ -n "$asset_path" ]; then
                js_status=$(curl -L -sS -o /tmp/reibun.js -w '%{http_code}' "$PUBLIC_URL$asset_path" || true)
              else
                js_status=000
              fi

              if [ "$manifest_status" = "200" ] && [ "$js_status" = "200" ] && grep -Fq "$EXPECTED_CONTENT_VERSION" /tmp/reibun.js; then
                echo "Live Cloudflare Worker is healthy and serves the expected content version."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Cloudflare exact-content smoke test failed after 4 minutes."
          echo "Last page HTTP status: ${status:-unknown}"
          echo "Last JS HTTP status: ${js_status:-unknown}"
          echo "Last asset path: ${asset_path:-unknown}"
          exit 1
