name: Cloudflare readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build Vite app
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
