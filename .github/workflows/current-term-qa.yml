name: Current term class QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-term:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source preservation, class isolation and all question data
        run: |
          node --import tsx scripts/current-term-model.ts
          node --import tsx scripts/validate-content.ts
          node --import tsx scripts/class29-previous-range-regression.ts
          npm run lint
          npm run build
      - name: Browsers and Japanese fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/current-term.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
      - name: Chromium phone and PC complete learning flows
        run: node --import tsx scripts/current-term-ui.ts
      - name: WebKit phone and PC complete learning flows
        env:
          BROWSER: webkit
        run: node --import tsx scripts/current-term-ui.ts
      - name: Guided flow, mobile widths and saved progress
        run: node --import tsx scripts/guided-learning-ui.ts
      - name: Guided flow in WebKit
        env:
          BROWSER: webkit
        run: node --import tsx scripts/guided-learning-ui.ts
      - name: Wait for exact existing Worker build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_URL: https://reibun.itisnowornever271.workers.dev
        run: |
          asset=$(grep -oE 'src="/assets/[^\"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          test -n "$asset"
          for n in $(seq 1 42); do
            if curl -fsSL "$PUBLIC_URL/?term_check=${GITHUB_SHA}" -o /tmp/current-live.html && grep -Fq "$asset" /tmp/current-live.html; then
              echo "Confirmed deployed asset: $asset"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact build is not live on the existing Worker.'
          exit 1
      - name: Verify public URL on phone and PC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_URL: https://reibun.itisnowornever271.workers.dev
          QA_OUT: audit/current-term-production
        run: node --import tsx scripts/current-term-ui.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-term-ui-evidence
          path: audit/current-term*/
          retention-days: 14
