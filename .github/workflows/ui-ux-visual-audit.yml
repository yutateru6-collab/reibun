name: UI UX visual audit

on:
  push:
    branches: [ui-ux-audit-20260907]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ui-ux-audit-20260907

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright audit dependencies
        run: npm install --no-save playwright @axe-core/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live screenshots and UX metrics
        env:
          PUBLIC_URL: https://reibun.itisnowornever271.workers.dev
        run: node scripts/ui-ux-audit.mjs

      - name: Show audit summary
        run: cat audit/ui-ux/summary.json

      - name: Commit audit evidence to audit branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/ui-ux
          if git diff --cached --quiet; then
            echo "No audit evidence changed."
            exit 0
          fi
          git commit -m "audit: capture live UI UX screenshots"
          git push origin HEAD:ui-ux-audit-20260907
