name: Compact home + bento menu

on:
  push:
    branches: [compact-home-bento-menu]
    paths:
      - audit/compact-bento-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: compact-home-bento-menu

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply compact home and bento menu
        run: node scripts/apply-compact-home-bento.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate source-derived content
        run: npx tsx scripts/validate-content.ts

      - name: Verify Hope mini explanations
        run: npx tsx scripts/validate-hope-mini-explanations.ts

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify held Hope card-face behavior remains untouched
        run: |
          grep -Fq '{currentCard.front}' src/App.tsx
          grep -Fq '{currentCard.translation}' src/App.tsx
          grep -Fq '(!isMemorize && !isFlipped) || (isMemorize && isFlipped)' src/App.tsx

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reibun-preview.log
          exit 1

      - name: Validate compact layout and capture screenshots
        env:
          PUBLIC_URL: http://127.0.0.1:4173
        run: node scripts/validate-compact-home-bento.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: compact-bento-screenshots
          path: audit/compact-bento/*.png
          retention-days: 7

      - name: Commit UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git commit -m 'ui: compact home and bento mode selector'
          git push origin compact-home-bento-menu
