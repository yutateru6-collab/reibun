name: Grammar category hub QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  learning-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve existing source data and validate new grammar bank
        run: |
          mkdir -p audit/knowledge-hub
          npm run lint
          npx tsx scripts/knowledge-model-regression.ts
          npx tsx scripts/validate-content.ts
          npx tsx scripts/workbook-model-regression.ts
          git archive --format=zip HEAD > audit/knowledge-hub/reviewed-source.zip
      - run: npm run build
      - name: Install browsers and Japanese fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hub-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
      - name: Three categories and all 108 questions in Chromium
        run: node scripts/knowledge-ui-regression.mjs
      - name: Three categories and all 108 questions in WebKit
        env:
          BROWSER: webkit
        run: node scripts/knowledge-ui-regression.mjs
      - name: Category structure and source-backed basics in Chromium
        run: npx tsx scripts/knowledge-hub-regression.ts
      - name: Category structure in WebKit
        env:
          BROWSER: webkit
        run: npx tsx scripts/knowledge-hub-regression.ts
      - name: Existing lessons and worksheets
        run: |
          npx tsx scripts/study-edge-regression.ts
          node scripts/workbook-ui-regression.mjs
      - name: Confirm this exact Cloudflare build
        if: github.ref == 'refs/heads/main'
        env:
          PUBLIC_URL: https://reibun.itisnowornever271.workers.dev
        run: |
          asset=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          test -n "$asset"
          for n in $(seq 1 42); do
            if curl -fsSL "$PUBLIC_URL/?grammar_hub_check=${GITHUB_SHA}" -o /tmp/live-hub.html && grep -Fq "$asset" /tmp/live-hub.html; then
              curl -fsSL "$PUBLIC_URL$asset" -o /tmp/live-hub.js
              if grep -Fq '完了形・未来表現・可算／不可算' /tmp/live-hub.js; then
                echo "Confirmed deployed asset: $asset" | tee audit/knowledge-hub/production-build.txt
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'The exact build is not live yet.'
          exit 1
      - name: Verify production category hub
        if: github.ref == 'refs/heads/main'
        env:
          APP_URL: https://reibun.itisnowornever271.workers.dev
          QA_OUT: audit/knowledge-hub/production
        run: npx tsx scripts/knowledge-hub-regression.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grammar-category-hub-qa
          path: audit/
          retention-days: 7
