name: Workbook and print QA
on:
  push:
    branches: [main, feat/tense-workbook-print-20260913]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types and original-source integrity
        run: |
          npm run lint
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-vq-exercises.ts
          npx tsx scripts/workbook-model-regression.ts
          npx tsx scripts/final-check-model-regression.ts
          npm run test:choice-layout
      - run: npm run build
      - name: Install browsers and Japanese fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
      - name: Chromium workbook, print, persistence and answer-key checks
        run: node scripts/workbook-ui-regression.mjs
      - name: WebKit workbook and persistence checks
        env:
          BROWSER: webkit
          QA_OUT: audit/workbook-webkit
        run: node scripts/workbook-ui-regression.mjs
      - name: Final-check flow in Chromium and WebKit
        run: npx tsx scripts/final-check-ui-regression.ts
      - name: Existing study modes regression
        run: npx tsx scripts/study-edge-regression.ts
      - name: Wait for this exact production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_URL: https://reibun.itisnowornever271.workers.dev
        run: |
          set -euo pipefail
          asset=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          test -n "$asset"
          for n in $(seq 1 36); do
            if curl -fsSL "$PUBLIC_URL/?workbook_check=${GITHUB_SHA}" -o /tmp/live.html && grep -Fq "$asset" /tmp/live.html; then
              curl -fsSL "$PUBLIC_URL$asset" -o /tmp/live.js
              if grep -Fq 'tense-workbook-v1' /tmp/live.js && grep -Fq 'quiz-launcher' /tmp/live.js && grep -Fq 'vq2-final-check-2026-v1' /tmp/live.js; then
                echo "Confirmed exact deployed asset: $asset"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'This build has not reached the existing reibun Worker.'
          exit 1
      - name: Verify the existing production app in Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_URL: https://reibun.itisnowornever271.workers.dev
          QA_OUT: audit/workbook-production
        run: node scripts/workbook-ui-regression.mjs
      - name: Verify final check in production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_URL: https://reibun.itisnowornever271.workers.dev
          QA_OUT: audit/final-check-production
        run: npx tsx scripts/final-check-ui-regression.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-qa
          path: audit/
          retention-days: 7
