name: Apply app shuffle hotfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Ordinary study-card order remains a learner preference.
          # Undo only the short-lived migration that forced the preference ON.
          replace_once(
              'src/main.tsx',
              """// Turn question-order shuffling on once for existing learners as well as new installs.\n// After this one-time migration, the learner can still switch shuffle off manually.\ntry {\n  const shuffleMigrationKey = 'flashcard-shuffle-default:v2';\n  if (localStorage.getItem(shuffleMigrationKey) !== 'done') {\n    localStorage.setItem('flashcard-shuffle', 'true');\n    localStorage.setItem(shuffleMigrationKey, 'done');\n  }\n} catch {\n  // Storage can be unavailable (for example in restricted/private contexts).\n  // The app continues to work with its in-memory defaults.\n}\n""",
              """// The v2 rollout briefly forced ordinary study cards into random order.\n// Quiz modes now shuffle independently, so restore normal study order once for learners\n// who received that migration. They can still turn card shuffling on themselves.\ntry {\n  const forcedShuffleKey = 'flashcard-shuffle-default:v2';\n  const rollbackKey = 'flashcard-shuffle-default-rollback:v3';\n  if (localStorage.getItem(forcedShuffleKey) === 'done' && localStorage.getItem(rollbackKey) !== 'done') {\n    localStorage.setItem('flashcard-shuffle', 'false');\n    localStorage.setItem(rollbackKey, 'done');\n  }\n} catch {\n  // Storage can be unavailable (for example in restricted/private contexts).\n  // The app continues to work with its in-memory defaults.\n}\n""",
          )

          # 2) Use unbiased Fisher-Yates everywhere a quiz/session is randomized.
          replace_once(
              'src/App.tsx',
              """function canonicalQuizAnswer(answer: string): string {\n  return answer\n    .replace(/\\s*\\[[^\\]]+\\]/g, '')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n""",
              """function canonicalQuizAnswer(answer: string): string {\n  return answer\n    .replace(/\\s*\\[[^\\]]+\\]/g, '')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n\nfunction shuffledCopy<T>(items: readonly T[]): T[] {\n  const copy = [...items];\n  for (let i = copy.length - 1; i > 0; i -= 1) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [copy[i], copy[j]] = [copy[j], copy[i]];\n  }\n  return copy;\n}\n""",
          )
          replace_once(
              'src/App.tsx',
              "setWordPool(words.sort(() => Math.random() - 0.5));",
              "setWordPool(shuffledCopy(words));",
          )
          replace_once(
              'src/App.tsx',
              "const cardsToUse = isShuffle ? [...pool].sort(() => Math.random() - 0.5) : [...pool];",
              "// Quiz modes always randomize question order. The study-card shuffle toggle only controls browsing cards.\n    const cardsToUse = shuffledCopy(pool);",
          )

          # Make the behavior visible instead of hiding it behind a setting.
          replace_once(
              'src/App.tsx',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug mt-1">単語を並べて仕上げ</p>',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug mt-1">単語も問題順も毎回シャッフル</p>',
          )
          replace_once(
              'src/App.tsx',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug mt-1">「まだ / わかった」で判定</p>',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug mt-1">問題順を毎回シャッフルして判定</p>',
          )
          replace_once(
              'src/App.tsx',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug">秒数を決めて高速反復</p>',
              '<p className="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-300 leading-snug">問題順を毎回シャッフルして高速反復</p>',
          )

          # 3) Clarify that the checkbox applies only to study-card browsing, not quizzes.
          replace_once(
              'src/hope/LessonMenu.tsx',
              '<label className="min-h-11 flex items-center gap-2.5 py-3 mt-2 text-sm font-semibold cursor-pointer"><input className="w-5 h-5 accent-indigo-600" type="checkbox" checked={props.shuffle} onChange={e => props.onShuffle(e.target.checked)} />問題の順番をシャッフル</label>',
              '<label className="min-h-11 flex items-center gap-2.5 py-3 mt-2 text-sm font-semibold cursor-pointer"><input className="w-5 h-5 accent-indigo-600" type="checkbox" checked={props.shuffle} onChange={e => props.onShuffle(e.target.checked)} />カード表示順をシャッフル</label>\n      <p className="-mt-1 mb-2 text-xs text-slate-500 dark:text-slate-400">※クイズはこの設定に関係なく、毎回問題順をシャッフルします。</p>',
          )

          # 4) Make the browser regression less flaky and explicitly prove that quiz sessions
          # shuffle even when the study-card shuffle preference is OFF.
          replace_once(
              'scripts/study-edge-regression.ts',
              "const page=await ctx.newPage(); page.setDefaultTimeout(7000);",
              "const page=await ctx.newPage(); page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(15000);",
          )
          marker = """  await run('time-completion',{[FAV]:JSON.stringify([vq.id])},async p=>{\n"""
          addition = """  await run('quiz-always-shuffles',{'flashcard-shuffle':'false'},async p=>{\n    await basic(p); await p.getByRole('button',{name:/Lesson 1 /}).first().click();\n    await p.evaluate(() => { Math.random = () => 0; });\n    await p.locator('[data-mode=order]').click();\n    const expected = basicExampleDecks[0].cards[1];\n    assert((await p.locator('body').innerText()).includes(expected.translation), 'quiz did not shuffle while study-card shuffle was OFF');\n  });\n""" + marker
          replace_once('scripts/study-edge-regression.ts', marker, addition)

          # Remove this one-shot workflow in the same product-fix commit.
          Path('.github/workflows/app-hotfix-once.yml').unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify types and production build before committing
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit and push the hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix quiz shuffling without randomizing study cards'
          git push origin HEAD:main
