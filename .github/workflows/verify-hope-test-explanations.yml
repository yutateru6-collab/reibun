name: Verify Hope test explanations

on:
  push:
    branches: [fix-hope-test-mini-explanations]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate all source-derived content
        run: |
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-hope-mini-explanations.ts
          npx tsx scripts/validate-vq-exercises.ts
      - name: Type-check and production build
        run: |
          npm run lint
          npm run build
      - name: Verify old Hope Test source-only panel is absent from active bundle
        run: |
          ! grep -R -Fq '【出典】Hope Test1 No.7' dist/assets/*.js
          grep -R -Fq 'To live と to learn' dist/assets/*.js
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - name: Exercise all mobile interactions including Hope Test1 No.7
        run: node scripts/postfix-interaction-regression.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-test-explanation-verification
          path: audit/postfix-interactions
          retention-days: 7
