name: Deep content audit

on:
  push:
    branches: [main, exam-2026-midterm-qa]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate all source-derived content
        run: npx tsx scripts/validate-content.ts

      - name: Verify attached Hope example bank fully replaced legacy content
        run: npx tsx scripts/validate-example-bank-replacement.ts

      - name: Verify all 110 Hope mini explanations
        run: npx tsx scripts/validate-hope-mini-explanations.ts

      - name: Independently hash-check all 66 visible VQ exercises
        run: npx tsx scripts/validate-vq-exercises.ts

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Verify legacy memorization text is absent from production bundle
        run: |
          set -euo pipefail
          if grep -R -F -q 'Who plays the hero?' dist; then
            echo 'Legacy memorization sentence is still bundled.'
            exit 1
          fi
          if grep -R -F -q 'Test 1 (文の種類)' dist; then
            echo 'Legacy memorization deck title is still bundled.'
            exit 1
          fi
          echo 'Legacy memorization content is absent from the production bundle.'

      - name: Verify mini explanations are bundled
        run: |
          set -euo pipefail
          grep -R -F -q '投稿は一瞬、スクショは長生き。' dist
          grep -R -F -q '💡ミニ解説' dist
          echo 'Hope mini explanations are present in the production bundle.'

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
