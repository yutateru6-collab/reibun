name: Apply and validate card centering
on:
  push:
    branches: [fix/center-study-card-20260913]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-study-card-20260913
      - name: Apply reviewed patch to exact original UI
        run: |
          set -euo pipefail
          test "$(git hash-object src/App.tsx)" = f34ab4f66ad04b903a5855342ac948dfd5407d57
          git apply --check .github/review/card-focus.patch
          git apply .github/review/card-focus.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: center study cards on entry and navigation without changing study content'
          git push origin HEAD:refs/heads/fix/center-study-card-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, preserved source data and build
        run: |
          npm run lint
          npx tsx scripts/validate-content.ts
          npx tsx scripts/unified-lessons-model.ts
          npx tsx scripts/workbook-model-regression.ts
          npm run build
      - name: Browsers and Japanese fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reibun-preview.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
      - name: Chromium card focus
        run: npx tsx scripts/card-focus-regression.ts
      - name: WebKit card focus
        env:
          BROWSER: webkit
        run: npx tsx scripts/card-focus-regression.ts
      - name: Existing study modes and lessons
        run: |
          npx tsx scripts/study-edge-regression.ts
          npx tsx scripts/unified-lessons-ui.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-focus-first-review
          path: audit/
          retention-days: 7
