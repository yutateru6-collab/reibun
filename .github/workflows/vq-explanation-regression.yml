name: VQ explanation regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  explanation-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate VQ source integrity and explanation UI rules
        run: |
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-vq-exercises.ts
          npx tsx scripts/validate-vq-explanation-ui.ts
      - name: Lint and build
        run: |
          npm run lint
          npm run build
