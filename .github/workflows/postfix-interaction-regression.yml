name: Mobile interaction regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/postfix-interaction-regression.mjs'
      - '.github/workflows/postfix-interaction-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/postfix-interaction-regression.mjs'
      - '.github/workflows/postfix-interaction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Source/content validation
        run: |
          npx tsx scripts/validate-content.ts
          npx tsx scripts/validate-hope-mini-explanations.ts
          npx tsx scripts/validate-vq-exercises.ts
      - name: Type-check and production build
        run: |
          npm run lint
          npm run build
      - name: Install Chromium and WebKit
        run: |
          npx playwright install --with-deps chromium webkit
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - name: Exercise all critical interactions
        run: node scripts/postfix-interaction-regression.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-regression
          path: audit/postfix-interactions
          retention-days: 7
